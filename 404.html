<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>404 — Lost In The Broker Dimension</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .notfound{
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px;
  }
  .glitch-num{
    font-family:var(--pixel); font-size:clamp(64px,22vw,140px); color:var(--accent);
    text-shadow:0 0 30px var(--glow), 0 0 60px var(--glow); animation:glitchPulse 2.4s ease-in-out infinite;
  }
  @keyframes glitchPulse{ 0%,100%{ opacity:1; transform:translateX(0);} 48%{ opacity:1;} 50%{ opacity:.75; transform:translateX(-2px);} 52%{ opacity:1; transform:translateX(2px);} }
  .notfound h2{ margin:18px 0 12px; font-size:20px; }
  .notfound p{ color:var(--text-dim); font-size:14.5px; max-width:380px; line-height:1.7; margin-bottom:30px; }
  .notfound-frame{
    width:140px; height:140px; border:2px solid var(--accent); border-radius:var(--radius); overflow:hidden;
    box-shadow:0 0 40px var(--glow); margin-bottom:30px; background:var(--card);
  }
  .notfound-frame img{ width:100%; height:100%; object-fit:cover; image-rendering:pixelated; opacity:0; transition:opacity .5s ease; }
  .notfound-frame img.show{ opacity:1; }
</style>
</head>
<body class="page-enter">
<div class="scanlines"></div>
<div class="notfound">
  <div class="notfound-frame"><img id="heroImg" alt="Broker Dickbutt NFT"></div>
  <div class="glitch-num">404</div>
  <h2>Lost In The Broker Dimension</h2>
  <p>This page doesn't exist — but 10,000 Brokers do. Let's get you back to the collection.</p>
  <a class="btn btn-primary" href="index.html">← Back to Broker Dickbutt</a>
</div>
<script src="script.js"></script>
<script>
  // 404 only needs the rotating preview image, not the full home-page logic
  if (typeof startHeroRotator === 'function') startHeroRotator('heroImg', null, 3200);
</script>
</body>
</html>
